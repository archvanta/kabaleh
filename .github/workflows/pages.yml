name: Deploy KABALEH
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the authorized website font
        run: node scripts/install-deployment-font.mjs
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build approved content and original photographs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Keep unrelated private files and owner documents out of publication
        run: |
          test ! -d out/.private
          test ! -f out/fonts/TERMS-Mahboubeh.pdf
          test -f out/fonts/mahboubeh-mehravar.woff2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
